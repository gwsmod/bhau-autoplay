<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fan Tan - Game Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(61, 90, 160, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(125, 255, 179, 0.08) 0%, transparent 50%);
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: linear-gradient(145deg, #111827, #0d1528);
            border-radius: 30px;
            padding: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(125, 255, 179, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(135deg, #7dffb3 0%, #3d5aa0 50%, #7dffb3 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .header .sub {
            color: #6a7a9a;
            font-size: 13px;
            margin-top: 4px;
        }

        .card {
            background: rgba(16, 24, 43, 0.8);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .card-title {
            color: #7dffb3;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #7a8aaa;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 22, 41, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            color: #eef2f9;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: rgba(125, 255, 179, 0.3);
            box-shadow: 0 0 20px rgba(125, 255, 179, 0.05);
        }

        .input-group input:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3d5aa0, #2a4a8a);
            color: #fff;
            box-shadow: 0 6px 20px rgba(61, 90, 160, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(61, 90, 160, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #1f8b4c, #167a3e);
            color: #fff;
            box-shadow: 0 6px 20px rgba(31, 139, 76, 0.3);
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .btn-warning {
            background: linear-gradient(135deg, #d4a020, #b8841a);
            color: #fff;
            box-shadow: 0 6px 20px rgba(212, 160, 32, 0.3);
        }

        .btn-warning:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #b13e4b, #8a2e3a);
            color: #fff;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #8a9aaa;
        }

        .btn-outline:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 12px;
            width: auto;
            flex: 1;
            min-width: 80px;
        }

        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .flex-row .btn {
            flex: 1;
            min-width: 100px;
        }

        .log-box {
            background: rgba(10, 15, 26, 0.9);
            border-radius: 12px;
            padding: 14px;
            max-height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #4a6a8a;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .log-box .success { color: #7dffb3; }
        .log-box .error { color: #ff6b6b; }
        .log-box .info { color: #5a8aba; }
        .log-box .warning { color: #ffa502; }
        .log-box .highlight { color: #ffd700; }

        .hidden {
            display: none !important;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.online {
            background: rgba(125, 255, 179, 0.08);
            color: #7dffb3;
            border: 1px solid rgba(125, 255, 179, 0.1);
        }

        .status-badge .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #7dffb3;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .mt-10 { margin-top: 10px; }
        .mt-20 { margin-top: 20px; }
        .mb-10 { margin-bottom: 10px; }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(42, 58, 90, 0.3);
            border-top: 3px solid #7dffb3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .game-details {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-top: 8px;
        }

        .game-details .label {
            color: #6a7a9a;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .game-details .value {
            color: #eef2f9;
            font-size: 13px;
            margin-top: 2px;
            word-break: break-all;
        }

        .phone-display {
            color: #7dffb3;
            font-weight: 700;
            font-size: 16px;
        }

        .game-url-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            word-break: break-all;
            font-size: 11px;
            color: #8a9aaa;
            margin: 8px 0;
            max-height: 100px;
            overflow-y: auto;
        }

        @media (max-width: 600px) {
            .container { padding: 16px; }
            .header h1 { font-size: 24px; }
            .flex-row { flex-direction: column; }
            .flex-row .btn { min-width: auto; }
        }

        .log-box::-webkit-scrollbar {
            width: 6px;
        }
        .log-box::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
        .log-box::-webkit-scrollbar-thumb {
            background: #3d5aa0;
            border-radius: 3px;
        }
        .log-box::-webkit-scrollbar-thumb:hover {
            background: #5a76b0;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Header -->
        <div class="header">
            <h1>🎰 FAN TAN GAME</h1>
            <div class="sub">
                <span class="status-badge online">
                    <span class="dot"></span> Ready to Launch
                </span>
            </div>
        </div>

        <!-- Login Section -->
        <div class="card" id="loginSection">
            <div class="input-group">
                <label>📱 Phone Number</label>
                <input type="text" id="phoneInput" placeholder="Enter 10-digit number" maxlength="10" />
            </div>
            <div class="input-group">
                <label>🔐 Password</label>
                <input type="password" id="passwordInput" value="Sanju2005" disabled />
                <span style="color:#6a7a9a;font-size:11px;">Auto-filled</span>
            </div>
            <button class="btn btn-primary" id="loginBtn">🔑 Login & Load Fan Tan</button>
            <div id="loginStatus" class="mt-10"></div>
        </div>

        <!-- Game Section -->
        <div id="gameSection" class="hidden">
            <div class="card">
                <div class="card-title">🎮 Fan Tan Game</div>
                <div class="game-details">
                    <div class="label">Game Name</div>
                    <div class="value" id="gameName">Fan Tan</div>
                </div>
                <div class="game-details">
                    <div class="label">Game ID</div>
                    <div class="value" id="gameId">27873</div>
                </div>
                <div class="game-details">
                    <div class="label">Status</div>
                    <div class="value" id="gameStatus" style="color:#ffa502;">Loading...</div>
                </div>
                <div class="game-details" id="urlSection" style="display:none;">
                    <div class="label">Game URL</div>
                    <div class="game-url-box" id="gameUrlDisplay"></div>
                </div>
                <button class="btn btn-success mt-20" id="launchBtn" style="display:none;">
                    🚀 Launch Fan Tan Game
                </button>
                <div class="flex-row mt-10">
                    <button class="btn btn-warning btn-sm" id="showUrlBtn" style="display:none;">🔗 Show URL</button>
                    <button class="btn btn-outline btn-sm" id="copyUrlBtn" style="display:none;">📋 Copy URL</button>
                    <button class="btn btn-outline btn-sm" id="refreshBtn">🔄 Refresh</button>
                </div>
            </div>
        </div>

        <!-- Log -->
        <div class="card">
            <div class="card-title" style="color:#5a8aba;">📄 Log Output</div>
            <div class="log-box" id="logBox">⏳ System ready. Please login...</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── STATE ──────────────────────────────────────────
            const state = {
                token: null,
                phone: null,
                password: 'Sanju2005',
                visitor: '0bcbcd2bea0bde4737e38d0e23bbf654dfc9',
                isLoggedIn: false,
                gameUrl: null,
                gameName: 'Fan Tan',
                evoSession: null
            };

            // ─── DOM REFS ──────────────────────────────────────
            const $ = (id) => document.getElementById(id);
            const loginSection = $('loginSection');
            const gameSection = $('gameSection');
            const loginBtn = $('loginBtn');
            const phoneInput = $('phoneInput');
            const passwordInput = $('passwordInput');
            const logBox = $('logBox');
            const gameName = $('gameName');
            const gameId = $('gameId');
            const gameStatus = $('gameStatus');
            const gameUrlDisplay = $('gameUrlDisplay');
            const urlSection = $('urlSection');
            const launchBtn = $('launchBtn');
            const showUrlBtn = $('showUrlBtn');
            const copyUrlBtn = $('copyUrlBtn');
            const refreshBtn = $('refreshBtn');

            // ─── LOGGING ──────────────────────────────────────
            function log(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const className = type || 'info';
                logBox.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
                logBox.scrollTop = logBox.scrollHeight;
            }

            function clearLog() {
                logBox.innerHTML = '';
            }

            // ─── API CALLS ──────────────────────────────────
            async function login(phone, password) {
                const visitor = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const device_id = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const req_date = Date.now();

                const payload = {
                    userPhone: phone,
                    password: password,
                    deviceCode: device_id,
                    distinctId: device_id,
                    channel: 'h5',
                    channelId: 'Samsung',
                    lang: 'en_US',
                    platform: 'h5',
                    packageId: 2,
                    packageInfo: 'com.resulta.checka',
                    versionCode: '999',
                    deviceBrand: 'Android',
                    deviceModel: 'Unknown',
                    visitor: visitor,
                    reqDate: req_date,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };

                log('📡 Sending login request...', 'info');

                try {
                    const response = await fetch('https://api.bh2255.xyz/app/password/login', {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json, text/plain, */*',
                            'Content-Type': 'application/json',
                            'Origin': 'https://playbhau.com',
                            'Referer': 'https://playbhau.com/',
                            'User-Agent': 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.status !== 200) {
                        log(`❌ HTTP Error: ${response.status}`, 'error');
                        return false;
                    }

                    const data = await response.json();

                    if (data.success && data.code === 0) {
                        let token = null;
                        const tokenData = data.data;

                        if (typeof tokenData === 'string' && tokenData.startsWith('eyJ')) {
                            token = tokenData;
                        } else if (typeof tokenData === 'object' && tokenData !== null) {
                            token = tokenData.accessToken || tokenData.token;
                        } else {
                            token = data.accessToken || data.token;
                        }

                        if (token) {
                            state.token = token;
                            state.isLoggedIn = true;
                            state.phone = phone;
                            log('✅ Login successful!', 'success');
                            return true;
                        }
                    }

                    log(`❌ Login failed: ${data.msg || 'Unknown error'}`, 'error');
                    return false;

                } catch (error) {
                    log(`❌ Network Error: ${error.message}`, 'error');
                    return false;
                }
            }

            async function getFanTanUrl() {
                if (!state.token) {
                    log('❌ Not logged in', 'error');
                    return null;
                }

                log('🎯 Fetching Fan Tan game URL...', 'info');

                const headers = {
                    'Accept': 'application/json, text/plain, */*',
                    'Token': state.token,
                    'Visitor': state.visitor,
                    'User-Agent': 'Mozilla/5.0 (Linux; Android 13; 22087RA4DI Build/TP1A.220624.014; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/150.0.7871.181 Mobile Safari/537.36',
                    'Origin': 'https://playbhau.com',
                    'Referer': 'https://playbhau.com/',
                    'Content-Type': 'application/json',
                    'PackageId': '2',
                    'x-requested-with': 'mark.via.gp'
                };

                try {
                    // Try the gaming2255 endpoint
                    const response = await fetch('https://ltapi.game712.com/iGaming/common/getGameStart?id=27873&otherGame=true', {
                        method: 'GET',
                        headers: headers
                    });

                    if (response.status === 200) {
                        const data = await response.json();
                        if (data.code === 0 && data.success) {
                            const gameData = data.data || {};
                            const gameName = gameData.gameName || '';
                            let gameUrl = gameData.gameUrl || '';

                            if (gameUrl && gameName.includes('Fan Tan')) {
                                gameUrl = gameUrl.replace(/\\/g, '');
                                gameUrl = decodeURIComponent(gameUrl);
                                
                                // Get EVO session
                                const evoSession = await getEvoSession();
                                if (evoSession) {
                                    state.evoSession = evoSession;
                                    if (!gameUrl.includes('JSESSIONID')) {
                                        gameUrl += `&JSESSIONID=${evoSession}`;
                                    }
                                }

                                log('✅ Fan Tan URL fetched!', 'success');
                                return {
                                    success: true,
                                    game_name: 'Fan Tan',
                                    game_url: gameUrl,
                                    iframe: gameData.iframe || false
                                };
                            }
                        }
                    }
                } catch (error) {
                    log(`⚠️ API error: ${error.message}`, 'warning');
                }

                // Fallback - Direct URL from logs
                log('🔄 Using fallback direct URL...', 'info');
                
                const evoSession = await getEvoSession() || 't7hc2g2imsdb4ndjt7reclgnapiyjh5x518c0e66';
                state.evoSession = evoSession;
                
                const directUrl = `https://skylinedja.evo-games.com/entry?params=Y2FzaW5vX2lkPXNreWxpbmVkamEwMDAwMDEKZ2FtZT1mYW50YW4Kc2lnbmF0dXJlPUZqeGZWRjZBM2x5TVpQMXF0Wkk2QXVWX1NkLTYwd1lLTWhTMTJZUEt1cXlsU0UyYWljUGNjYzI4N3NpVzlSM1VJRmlnUzhyQkw1aWRxdGZfbWF4U3R3CnVhX2xhdW5jaF9pZD0xOGM5ZTIxZWZkMTQzMDU2OWVmYzQ1MzAKdGFibGVfaWQ9RmFuVGFuMDAwMDAwMDAwMQpzaXRlPTEKandzaD1leUpyYVdRaU9pSXhOek01TkRRNE5EQXhOemsxSWl3aVlXeG5Jam9pUlZNeU5UWWlmUQpwbGF5X21vZGU9cmVhbF9tb25leQo&JSESSIONID=${evoSession}&embedded`;
                
                log('✅ Fallback URL ready', 'success');
                return {
                    success: true,
                    game_name: 'Fan Tan',
                    game_url: directUrl,
                    iframe: false
                };
            }

            async function getEvoSession() {
                if (!state.token) return null;

                try {
                    const headers = {
                        'Accept': 'application/json, text/plain, */*',
                        'Token': state.token,
                        'Visitor': state.visitor,
                        'User-Agent': 'Mozilla/5.0 (Linux; Android 13; 22087RA4DI Build/TP1A.220624.014; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/150.0.7871.181 Mobile Safari/537.36',
                        'Origin': 'https://playbhau.com',
                        'Referer': 'https://playbhau.com/',
                        'Content-Type': 'application/json',
                        'PackageId': '2',
                        'x-requested-with': 'mark.via.gp'
                    };

                    // Try to get session from setup
                    const response = await fetch('https://skylinedja.evo-games.com/setup?device=phone&wrapped=true&locale=en-GB&client_version=6.20260807.73029.63999-7979cb55ff-r2', {
                        method: 'GET',
                        headers: headers
                    });

                    if (response.status === 200) {
                        const data = await response.json();
                        if (data.session_id) {
                            return data.session_id;
                        }
                    }
                } catch (error) {
                    // Ignore
                }

                return null;
            }

            // ─── UI FUNCTIONS ──────────────────────────────────
            function updateGameUI(gameInfo) {
                if (!gameInfo || !gameInfo.success) {
                    gameStatus.textContent = '❌ Failed to load';
                    gameStatus.style.color = '#ff6b6b';
                    log('❌ Failed to load Fan Tan', 'error');
                    return;
                }

                state.gameUrl = gameInfo.game_url;
                state.gameName = gameInfo.game_name || 'Fan Tan';

                gameName.textContent = state.gameName;
                gameId.textContent = '27873';
                gameStatus.textContent = '✅ Ready to Launch';
                gameStatus.style.color = '#7dffb3';

                // Show URL
                gameUrlDisplay.textContent = gameInfo.game_url;
                urlSection.style.display = 'block';
                launchBtn.style.display = 'flex';
                showUrlBtn.style.display = 'flex';
                copyUrlBtn.style.display = 'flex';

                log(`✅ ${state.gameName} loaded successfully!`, 'success');
                log('🚀 Click "Launch Fan Tan Game" to start', 'info');
            }

            // ─── HANDLERS ──────────────────────────────────────
            async function handleLogin() {
                const phone = phoneInput.value.trim();
                const password = passwordInput.value.trim();

                if (!phone || phone.length !== 10) {
                    log('❌ Please enter a valid 10-digit phone number', 'error');
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.innerHTML = '⏳ Logging in...';
                clearLog();
                log('🚀 Starting login process...', 'info');

                const success = await login(phone, password);

                if (success) {
                    loginSection.classList.add('hidden');
                    gameSection.classList.remove('hidden');
                    
                    gameStatus.textContent = '⏳ Loading Fan Tan...';
                    gameStatus.style.color = '#ffa502';
                    log('⏳ Loading Fan Tan game...', 'info');

                    const gameInfo = await getFanTanUrl();
                    if (gameInfo && gameInfo.success) {
                        updateGameUI(gameInfo);
                    } else {
                        gameStatus.textContent = '❌ Failed to load';
                        gameStatus.style.color = '#ff6b6b';
                        log('❌ Could not load Fan Tan', 'error');
                    }
                } else {
                    log('❌ Login failed. Please try again.', 'error');
                }

                loginBtn.disabled = false;
                loginBtn.innerHTML = '🔑 Login & Load Fan Tan';
            }

            function handleLaunch() {
                if (!state.gameUrl) {
                    log('❌ No game URL available', 'error');
                    return;
                }

                log('🚀 Launching Fan Tan game...', 'info');
                window.open(state.gameUrl, '_blank');
                log('✅ Game opened in new tab!', 'success');
            }

            function handleShowUrl() {
                if (!state.gameUrl) {
                    log('❌ No game URL available', 'error');
                    return;
                }

                log('🔗 Game URL:', 'info');
                log(state.gameUrl, 'highlight');
                
                urlSection.style.display = 'block';
                gameUrlDisplay.textContent = state.gameUrl;
            }

            function handleCopyUrl() {
                if (!state.gameUrl) {
                    log('❌ No URL to copy', 'error');
                    return;
                }

                if (navigator.clipboard) {
                    navigator.clipboard.writeText(state.gameUrl).then(() => {
                        log('📋 URL copied to clipboard!', 'success');
                    }).catch(() => {
                        // Fallback
                        const textArea = document.createElement('textarea');
                        textArea.value = state.gameUrl;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        log('📋 URL copied!', 'success');
                    });
                } else {
                    const textArea = document.createElement('textarea');
                    textArea.value = state.gameUrl;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    log('📋 URL copied!', 'success');
                }
            }

            async function handleRefresh() {
                log('🔄 Refreshing Fan Tan game...', 'info');
                gameStatus.textContent = '⏳ Refreshing...';
                gameStatus.style.color = '#ffa502';
                
                const gameInfo = await getFanTanUrl();
                if (gameInfo && gameInfo.success) {
                    updateGameUI(gameInfo);
                    log('✅ Game refreshed!', 'success');
                } else {
                    gameStatus.textContent = '❌ Refresh failed';
                    gameStatus.style.color = '#ff6b6b';
                    log('❌ Could not refresh game', 'error');
                }
            }

            // ─── EVENT LISTENERS ──────────────────────────────
            loginBtn.addEventListener('click', handleLogin);
            launchBtn.addEventListener('click', handleLaunch);
            showUrlBtn.addEventListener('click', handleShowUrl);
            copyUrlBtn.addEventListener('click', handleCopyUrl);
            refreshBtn.addEventListener('click', handleRefresh);

            // Enter key support
            phoneInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleLogin();
                }
            });

            // ─── AUTO LOGIN ──────────────────────────────────
            window.addEventListener('DOMContentLoaded', function() {
                log('🎯 Fan Tan Game Launcher Ready', 'info');
                log('📱 Enter phone number and click Login', 'info');
                log('🔐 Password: Sanju2005 (auto-filled)', 'info');
                phoneInput.focus();
            });

        })();
    </script>
</body>
