<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fan Tan - Game Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(61, 90, 160, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(125, 255, 179, 0.08) 0%, transparent 50%);
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: linear-gradient(145deg, #111827, #0d1528);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(125, 255, 179, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, #7dffb3 0%, #3d5aa0 50%, #7dffb3 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .header .sub {
            color: #6a7a9a;
            font-size: 14px;
            margin-top: 5px;
        }

        .card {
            background: rgba(16, 24, 43, 0.8);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3d5aa0, #2a4a8a);
            color: #fff;
            box-shadow: 0 6px 20px rgba(61, 90, 160, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(61, 90, 160, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #1f8b4c, #167a3e);
            color: #fff;
            box-shadow: 0 6px 20px rgba(31, 139, 76, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #b13e4b, #8a2e3a);
            color: #fff;
        }

        .btn-warning {
            background: linear-gradient(135deg, #d4a020, #b8841a);
            color: #fff;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #8a9aaa;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-full {
            width: 100%;
            justify-content: center;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #7a8aaa;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 22, 41, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: #eef2f9;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: rgba(125, 255, 179, 0.3);
            box-shadow: 0 0 20px rgba(125, 255, 179, 0.05);
        }

        .log-box {
            background: rgba(10, 15, 26, 0.9);
            border-radius: 14px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #4a6a8a;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .log-box .success { color: #7dffb3; }
        .log-box .error { color: #ff6b6b; }
        .log-box .info { color: #5a8aba; }
        .log-box .warning { color: #ffa502; }
        .log-box .highlight { color: #ffd700; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.online {
            background: rgba(125, 255, 179, 0.08);
            color: #7dffb3;
            border: 1px solid rgba(125, 255, 179, 0.1);
        }

        .status-badge .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #7dffb3;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .flex-row .btn {
            flex: 1;
            min-width: 120px;
            justify-content: center;
        }

        .game-details {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
        }

        .game-details .label {
            color: #6a7a9a;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .game-details .value {
            color: #eef2f9;
            font-size: 14px;
            margin-top: 3px;
            word-break: break-all;
        }

        .hidden {
            display: none !important;
        }

        .mt-10 { margin-top: 10px; }
        .mt-20 { margin-top: 20px; }
        .mb-10 { margin-bottom: 10px; }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(42, 58, 90, 0.3);
            border-top: 3px solid #7dffb3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .header h1 { font-size: 28px; }
            .flex-row { flex-direction: column; }
            .flex-row .btn { min-width: auto; }
        }

        /* Scrollbar */
        .log-box::-webkit-scrollbar {
            width: 6px;
        }
        .log-box::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
        .log-box::-webkit-scrollbar-thumb {
            background: #3d5aa0;
            border-radius: 3px;
        }
        .log-box::-webkit-scrollbar-thumb:hover {
            background: #5a76b0;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Header -->
        <div class="header">
            <h1>🎰 FAN TAN GAME LAUNCHER</h1>
            <div class="sub">
                <span class="status-badge online">
                    <span class="dot"></span> System Ready
                </span>
            </div>
        </div>

        <!-- Login Section -->
        <div class="card" id="loginSection">
            <div class="input-group">
                <label>📱 Phone Number</label>
                <input type="text" id="phoneInput" value="8597630383" readonly />
            </div>
            <div class="input-group">
                <label>🔐 Password</label>
                <input type="password" id="passwordInput" value="Sanju2005" readonly />
            </div>
            <button class="btn btn-primary btn-full" id="loginBtn">
                🔑 Login & Get Fan Tan
            </button>
            <div id="loginStatus" class="mt-10"></div>
        </div>

        <!-- Game Info Section -->
        <div id="gameSection" class="hidden">
            <div class="card">
                <div class="flex-row">
                    <button class="btn btn-success" id="launchBtn">🎮 Launch Game</button>
                    <button class="btn btn-warning" id="showUrlBtn">🔗 Show URL</button>
                    <button class="btn btn-danger" id="resetBtn">🔄 Reset</button>
                </div>
            </div>

            <div class="card">
                <h3 style="color:#7dffb3;margin-bottom:10px;">📋 Game Details</h3>
                <div id="gameDetails">
                    <div class="game-details">
                        <div class="label">Game Name</div>
                        <div class="value" id="gameName">—</div>
                    </div>
                    <div class="game-details">
                        <div class="label">Game ID</div>
                        <div class="value" id="gameId">27873</div>
                    </div>
                    <div class="game-details">
                        <div class="label">Game URL</div>
                        <div class="value" id="gameUrl" style="font-size:11px;word-break:break-all;">—</div>
                    </div>
                    <div class="game-details">
                        <div class="label">Iframe</div>
                        <div class="value" id="gameIframe">—</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3 style="color:#5a8aba;margin-bottom:10px;">📄 Log Output</h3>
                <div class="log-box" id="logBox">⏳ Waiting for action...</div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── STATE ──────────────────────────────────────────
            const state = {
                token: null,
                phone: '8597630383',
                password: 'Sanju2005',
                visitor: 'f48b0eb8dabc1d4971d30e0dae3a7ed95e3e',
                gameInfo: null,
                isLoggedIn: false
            };

            // ─── DOM REFS ──────────────────────────────────────
            const $ = (id) => document.getElementById(id);
            const loginSection = $('loginSection');
            const gameSection = $('gameSection');
            const loginBtn = $('loginBtn');
            const phoneInput = $('phoneInput');
            const passwordInput = $('passwordInput');
            const logBox = $('logBox');
            const gameName = $('gameName');
            const gameId = $('gameId');
            const gameUrl = $('gameUrl');
            const gameIframe = $('gameIframe');
            const launchBtn = $('launchBtn');
            const showUrlBtn = $('showUrlBtn');
            const resetBtn = $('resetBtn');

            // ─── LOGGING ──────────────────────────────────────
            function log(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const className = type || 'info';
                logBox.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
                logBox.scrollTop = logBox.scrollHeight;
            }

            function clearLog() {
                logBox.innerHTML = '';
            }

            // ─── API CALLS ──────────────────────────────────
            async function login(phone, password) {
                const visitor = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const device_id = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const req_date = Date.now();

                const payload = {
                    userPhone: phone,
                    password: password,
                    deviceCode: device_id,
                    distinctId: device_id,
                    channel: 'h5',
                    channelId: 'Samsung',
                    lang: 'en_US',
                    platform: 'h5',
                    packageId: 2,
                    packageInfo: 'com.resulta.checka',
                    versionCode: '999',
                    deviceBrand: 'Android',
                    deviceModel: 'Unknown',
                    visitor: visitor,
                    reqDate: req_date,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };

                log('📡 Sending login request...', 'info');

                try {
                    const response = await fetch('https://api.bh2255.xyz/app/password/login', {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json, text/plain, */*',
                            'Content-Type': 'application/json',
                            'Origin': 'https://playbhau.com',
                            'Referer': 'https://playbhau.com/',
                            'User-Agent': 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                        },
                        body: JSON.stringify(payload)
                    });

                    log(`📊 Status: ${response.status}`, 'info');

                    if (response.status !== 200) {
                        log(`❌ HTTP Error: ${response.status}`, 'error');
                        return false;
                    }

                    const data = await response.json();
                    log(`📊 Response Code: ${data.code}`, 'info');
                    log(`💬 Message: ${data.msg}`, 'info');

                    if (data.success && data.code === 0) {
                        let token = null;
                        const tokenData = data.data;

                        if (typeof tokenData === 'string' && tokenData.startsWith('eyJ')) {
                            token = tokenData;
                        } else if (typeof tokenData === 'object' && tokenData !== null) {
                            token = tokenData.accessToken || tokenData.token;
                        } else {
                            token = data.accessToken || data.token;
                        }

                        if (token) {
                            state.token = token;
                            state.isLoggedIn = true;
                            log('✅ Login successful!', 'success');
                            return true;
                        } else {
                            log('❌ No token found', 'error');
                            return false;
                        }
                    } else {
                        log(`❌ Login failed: ${data.msg || 'Unknown error'}`, 'error');
                        return false;
                    }
                } catch (error) {
                    log(`❌ Network Error: ${error.message}`, 'error');
                    return false;
                }
            }

            async function getGameUrl(gameId = 27873) {
                if (!state.token) {
                    log('❌ Not logged in', 'error');
                    return null;
                }

                log(`🎯 Fetching game URL for ID: ${gameId}...`, 'info');

                const payload = {
                    gameId: gameId,
                    channel: 'h5',
                    channelId: 'Samsung',
                    lang: 'en_US',
                    visitor: state.visitor,
                    packageId: 2,
                    packageInfo: 'com.resulta.checka',
                    reqDate: Date.now(),
                    versionCode: '999',
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };

                const headers = {
                    'Accept': 'application/json, text/plain, */*',
                    'Token': state.token,
                    'Visitor': state.visitor,
                    'Content-Type': 'application/json',
                    'Origin': 'https://playbhau.com',
                    'Referer': 'https://playbhau.com/',
                    'PackageId': '2',
                    'User-Agent': 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };

                const endpoints = [
                    'https://api.gaming2255.net/iGaming/common/getGameStart',
                    'https://api.gaming2255.net/iGaming/game/start',
                    'https://api.gaming2255.net/app/game/start',
                    'https://api.bh2255.xyz/app/game/start'
                ];

                for (const url of endpoints) {
                    try {
                        log(`  Trying: ${url}`, 'info');

                        const response = await fetch(url, {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify(payload)
                        });

                        if (response.status === 200) {
                            const data = await response.json();

                            if (data.code === 0 && data.success) {
                                const gameData = data.data || {};
                                const name = gameData.gameName || gameData.name || 'Fan Tan';
                                let urlGame = gameData.gameUrl || gameData.url || gameData.launchUrl;

                                if (urlGame) {
                                    urlGame = urlGame.replace(/\\/g, '');
                                    log(`✅ Found game: ${name}`, 'success');

                                    return {
                                        success: true,
                                        game_name: name,
                                        game_url: urlGame,
                                        iframe: gameData.iframe || false,
                                        raw_data: gameData
                                    };
                                }
                            }
                        }
                    } catch (e) {
                        log(`  ❌ Error: ${e.message}`, 'error');
                    }
                }

                // Fallback - Direct Evolution URL
                log('  Using direct Evolution URL...', 'warning');
                const directUrl = 'https://skylinedja.evo-games.com/entry?params=eyJjYXNpbm9faWQiOiJzay1saW5lZGphMDAwMSIsImdhbWVfaWQiOiJGYW5UYW4iLCJ0YWJsZV9pZCI6Ijc4NzMiLCJjdXJyZW5jeSI6IklOUiIsImxhbmciOiJlbiJ9';

                return {
                    success: true,
                    game_name: 'Fan Tan',
                    game_url: directUrl,
                    iframe: false,
                    raw_data: { gameName: 'Fan Tan', gameUrl: directUrl }
                };
            }

            // ─── UI UPDATE ──────────────────────────────────
            function updateGameUI(gameInfo) {
                if (!gameInfo || !gameInfo.success) {
                    log('❌ No game info available', 'error');
                    return;
                }

                state.gameInfo = gameInfo;

                gameName.textContent = gameInfo.game_name || 'Fan Tan';
                gameId.textContent = '27873';
                gameUrl.textContent = gameInfo.game_url || 'N/A';
                gameIframe.textContent = gameInfo.iframe ? '✅ Yes' : '❌ No';

                log(`📛 Game: ${gameInfo.game_name}`, 'success');
                log(`🔗 URL: ${gameInfo.game_url.substring(0, 80)}...`, 'info');
            }

            function showGameSection() {
                loginSection.classList.add('hidden');
                gameSection.classList.remove('hidden');
            }

            function resetApp() {
                state.token = null;
                state.isLoggedIn = false;
                state.gameInfo = null;
                loginSection.classList.remove('hidden');
                gameSection.classList.add('hidden');
                clearLog();
                log('🔄 Reset complete. Ready to login.', 'info');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '🔑 Login & Get Fan Tan';
            }

            // ─── HANDLERS ────────────────────────────────────
            async function handleLogin() {
                const phone = phoneInput.value.trim();
                const password = passwordInput.value.trim();

                if (!phone || !password) {
                    log('❌ Phone and password required!', 'error');
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.innerHTML = '⏳ Logging in...';
                clearLog();
                log('🚀 Starting login process...', 'info');

                const success = await login(phone, password);

                if (success) {
                    log('🔍 Fetching game details...', 'info');
                    const gameInfo = await getGameUrl(27873);

                    if (gameInfo && gameInfo.success) {
                        showGameSection();
                        updateGameUI(gameInfo);
                        log('✅ Ready to launch!', 'success');
                    } else {
                        log('❌ Could not get game details', 'error');
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = '🔑 Login & Get Fan Tan';
                    }
                } else {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '🔑 Login & Get Fan Tan';
                }
            }

            function handleLaunch() {
                if (!state.gameInfo || !state.gameInfo.game_url) {
                    log('❌ No game URL available', 'error');
                    return;
                }

                const url = state.gameInfo.game_url;
                log(`🌐 Opening game in new tab...`, 'info');
                window.open(url, '_blank');
                log('✅ Browser tab opened!', 'success');
            }

            function handleShowUrl() {
                if (!state.gameInfo || !state.gameInfo.game_url) {
                    log('❌ No game URL available', 'error');
                    return;
                }

                const url = state.gameInfo.game_url;
                log(`🔗 Game URL:`, 'info');
                log(`${url}`, 'highlight');

                // Copy to clipboard
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(url).then(() => {
                        log('📋 URL copied to clipboard!', 'success');
                    }).catch(() => {
                        log('💡 Copy the URL manually', 'warning');
                    });
                } else {
                    log('💡 Select and copy the URL manually', 'warning');
                }
            }

            // ─── EVENT LISTENERS ────────────────────────────
            loginBtn.addEventListener('click', handleLogin);
            launchBtn.addEventListener('click', handleLaunch);
            showUrlBtn.addEventListener('click', handleShowUrl);
            resetBtn.addEventListener('click', resetApp);

            // Enter key support
            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !loginSection.classList.contains('hidden')) {
                    handleLogin();
                }
            });

            // ─── AUTO LOGIN ON LOAD ────────────────────────────
            window.addEventListener('DOMContentLoaded', function() {
                log('🚀 System ready. Click "Login & Get Fan Tan" to start.', 'info');
                log('💡 Phone: 8597630383, Password: Sanju2005 (auto-filled)', 'info');
                
                // Auto login after 1 second
                setTimeout(() => {
                    handleLogin();
                }, 1000);
            });

        })();
    </script>
</body>
</html>
