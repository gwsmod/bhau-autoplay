<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fan Tan - Direct Launch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(ellipse at 10% 20%, rgba(61, 90, 160, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(125, 255, 179, 0.08) 0%, transparent 50%);
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: linear-gradient(145deg, #111827, #0d1528);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(125, 255, 179, 0.06);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #7dffb3 0%, #3d5aa0 50%, #7dffb3 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .header .sub {
            color: #6a7a9a;
            font-size: 13px;
            margin-top: 5px;
        }

        .card {
            background: rgba(16, 24, 43, 0.8);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .card-title {
            color: #7dffb3;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3d5aa0, #2a4a8a);
            color: #fff;
            box-shadow: 0 6px 20px rgba(61, 90, 160, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(61, 90, 160, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #1f8b4c, #167a3e);
            color: #fff;
            box-shadow: 0 6px 20px rgba(31, 139, 76, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
        }

        .btn-warning {
            background: linear-gradient(135deg, #d4a020, #b8841a);
            color: #fff;
            box-shadow: 0 6px 20px rgba(212, 160, 32, 0.3);
        }

        .btn-warning:hover {
            transform: translateY(-2px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #b13e4b, #8a2e3a);
            color: #fff;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #8a9aaa;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-full {
            width: 100%;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #7a8aaa;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(15, 22, 41, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: #eef2f9;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: rgba(125, 255, 179, 0.3);
            box-shadow: 0 0 20px rgba(125, 255, 179, 0.05);
        }

        .log-box {
            background: rgba(10, 15, 26, 0.9);
            border-radius: 14px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #4a6a8a;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 10px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .log-box .success { color: #7dffb3; }
        .log-box .error { color: #ff6b6b; }
        .log-box .info { color: #5a8aba; }
        .log-box .warning { color: #ffa502; }
        .log-box .highlight { color: #ffd700; }

        .hidden {
            display: none !important;
        }

        .flex-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .flex-row .btn {
            flex: 1;
            min-width: 120px;
        }

        .game-details {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
        }

        .game-details .label {
            color: #6a7a9a;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .game-details .value {
            color: #eef2f9;
            font-size: 14px;
            margin-top: 3px;
            word-break: break-all;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.online {
            background: rgba(125, 255, 179, 0.08);
            color: #7dffb3;
            border: 1px solid rgba(125, 255, 179, 0.1);
        }

        .status-badge .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #7dffb3;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .mt-10 { margin-top: 10px; }
        .mt-20 { margin-top: 20px; }
        .mb-10 { margin-bottom: 10px; }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(42, 58, 90, 0.3);
            border-top: 3px solid #7dffb3;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .launch-btn-big {
            padding: 20px;
            font-size: 20px;
            border-radius: 16px;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .header h1 { font-size: 24px; }
            .flex-row { flex-direction: column; }
            .flex-row .btn { min-width: auto; }
            .launch-btn-big { font-size: 16px; padding: 16px; }
        }

        .log-box::-webkit-scrollbar {
            width: 6px;
        }
        .log-box::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }
        .log-box::-webkit-scrollbar-thumb {
            background: #3d5aa0;
            border-radius: 3px;
        }
        .log-box::-webkit-scrollbar-thumb:hover {
            background: #5a76b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎰 FAN TAN GAME</h1>
            <div class="sub">
                <span class="status-badge online">
                    <span class="dot"></span> Ready to Launch
                </span>
            </div>
        </div>

        <!-- Login Section -->
        <div class="card" id="loginSection">
            <div class="input-group">
                <label>📱 Phone Number</label>
                <input type="text" id="phoneInput" value="8597630383" readonly />
            </div>
            <div class="input-group">
                <label>🔐 Password</label>
                <input type="password" id="passwordInput" value="Sanju2005" readonly />
            </div>
            <button class="btn btn-primary btn-full" id="loginBtn">
                🔑 Login & Load Game
            </button>
        </div>

        <!-- Game Section -->
        <div id="gameSection" class="hidden">
            <div class="card">
                <div class="card-title">🎮 Fan Tan Game</div>
                
                <!-- Game Details -->
                <div class="game-details">
                    <div class="label">Game Name</div>
                    <div class="value" id="gameName">Fan Tan</div>
                </div>
                <div class="game-details">
                    <div class="label">Game ID</div>
                    <div class="value" id="gameId">27873</div>
                </div>
                <div class="game-details">
                    <div class="label">Status</div>
                    <div class="value" id="gameStatus" style="color:#7dffb3;">✅ Ready</div>
                </div>

                <!-- Launch Button -->
                <button class="btn btn-success btn-full launch-btn-big mt-20" id="launchBtn">
                    🚀 LAUNCH FAN TAN GAME
                </button>

                <div class="flex-row mt-10">
                    <button class="btn btn-warning" id="showUrlBtn">🔗 Show URL</button>
                    <button class="btn btn-outline" id="refreshBtn">🔄 Refresh</button>
                </div>
            </div>

            <!-- URL Display -->
            <div class="card" id="urlCard" style="display:none;">
                <div class="card-title" style="color:#ffd700;">🔗 Game URL</div>
                <div style="background:rgba(0,0,0,0.3);padding:12px;border-radius:10px;word-break:break-all;font-size:12px;color:#8a9aaa;" id="urlDisplay"></div>
                <button class="btn btn-primary btn-full mt-10" id="copyUrlBtn">📋 Copy URL</button>
            </div>
        </div>

        <!-- Log -->
        <div class="card">
            <div class="card-title" style="color:#5a8aba;">📄 Log</div>
            <div class="log-box" id="logBox">⏳ System ready. Please login...</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ─── STATE ──────────────────────────────────────────
            const state = {
                token: null,
                phone: '8597630383',
                password: 'Sanju2005',
                visitor: 'f48b0eb8dabc1d4971d30e0dae3a7ed95e3e',
                isLoggedIn: false,
                gameUrl: null,
                gameName: 'Fan Tan'
            };

            // ─── DOM REFS ──────────────────────────────────────
            const $ = (id) => document.getElementById(id);
            const loginSection = $('loginSection');
            const gameSection = $('gameSection');
            const loginBtn = $('loginBtn');
            const phoneInput = $('phoneInput');
            const passwordInput = $('passwordInput');
            const logBox = $('logBox');
            const gameName = $('gameName');
            const gameId = $('gameId');
            const gameStatus = $('gameStatus');
            const launchBtn = $('launchBtn');
            const showUrlBtn = $('showUrlBtn');
            const refreshBtn = $('refreshBtn');
            const urlCard = $('urlCard');
            const urlDisplay = $('urlDisplay');
            const copyUrlBtn = $('copyUrlBtn');

            // ─── LOGGING ──────────────────────────────────────
            function log(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const className = type || 'info';
                logBox.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
                logBox.scrollTop = logBox.scrollHeight;
            }

            function clearLog() {
                logBox.innerHTML = '';
            }

            // ─── DIRECT FAN TAN URL ──────────────────────────
            function getDirectFanTanUrl() {
                // Direct Evolution URL for Fan Tan
                return 'https://skylinedja.evo-games.com/entry?params=eyJjYXNpbm9faWQiOiJzay1saW5lZGphMDAwMSIsImdhbWVfaWQiOiJGYW5UYW4iLCJ0YWJsZV9pZCI6Ijc4NzMiLCJjdXJyZW5jeSI6IklOUiIsImxhbmciOiJlbiJ9';
            }

            // ─── API CALLS ──────────────────────────────────
            async function login(phone, password) {
                const visitor = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const device_id = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                const req_date = Date.now();

                const payload = {
                    userPhone: phone,
                    password: password,
                    deviceCode: device_id,
                    distinctId: device_id,
                    channel: 'h5',
                    channelId: 'Samsung',
                    lang: 'en_US',
                    platform: 'h5',
                    packageId: 2,
                    packageInfo: 'com.resulta.checka',
                    versionCode: '999',
                    deviceBrand: 'Android',
                    deviceModel: 'Unknown',
                    visitor: visitor,
                    reqDate: req_date,
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };

                log('📡 Logging in...', 'info');

                try {
                    const response = await fetch('https://api.bh2255.xyz/app/password/login', {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json, text/plain, */*',
                            'Content-Type': 'application/json',
                            'Origin': 'https://playbhau.com',
                            'Referer': 'https://playbhau.com/',
                            'User-Agent': 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.status !== 200) {
                        log(`❌ HTTP Error: ${response.status}`, 'error');
                        return false;
                    }

                    const data = await response.json();

                    if (data.success && data.code === 0) {
                        let token = null;
                        const tokenData = data.data;

                        if (typeof tokenData === 'string' && tokenData.startsWith('eyJ')) {
                            token = tokenData;
                        } else if (typeof tokenData === 'object' && tokenData !== null) {
                            token = tokenData.accessToken || tokenData.token;
                        } else {
                            token = data.accessToken || data.token;
                        }

                        if (token) {
                            state.token = token;
                            state.isLoggedIn = true;
                            log('✅ Login successful!', 'success');
                            return true;
                        }
                    }

                    log(`❌ Login failed: ${data.msg || 'Unknown error'}`, 'error');
                    return false;

                } catch (error) {
                    log(`❌ Network Error: ${error.message}`, 'error');
                    return false;
                }
            }

            async function getGameUrl(gameId = 27873) {
                if (!state.token) {
                    log('❌ Not logged in', 'error');
                    return null;
                }

                log('🎯 Fetching Fan Tan game URL...', 'info');

                const payload = {
                    gameId: gameId,
                    channel: 'h5',
                    channelId: 'Samsung',
                    lang: 'en_US',
                    visitor: state.visitor,
                    packageId: 2,
                    packageInfo: 'com.resulta.checka',
                    reqDate: Date.now(),
                    versionCode: '999',
                    ua: 'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36'
                };

                const headers = {
                    'Accept': 'application/json, text/plain, */*',
                    'Token': state.token,
                    'Visitor': state.visitor,
                    'Content-Type': 'application/json',
                    'Origin': 'https://playbhau.com',
                    'Referer': 'https://playbhau.com/',
                    'PackageId': '2'
                };

                try {
                    // Try primary endpoint
                    const response = await fetch('https://api.gaming2255.net/iGaming/common/getGameStart', {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 200) {
                        const data = await response.json();
                        if (data.code === 0 && data.success) {
                            const gameData = data.data || {};
                            let url = gameData.gameUrl || gameData.url || gameData.launchUrl;
                            if (url) {
                                url = url.replace(/\\/g, '');
                                log('✅ Game URL fetched!', 'success');
                                return {
                                    success: true,
                                    game_name: gameData.gameName || 'Fan Tan',
                                    game_url: url,
                                    raw: gameData
                                };
                            }
                        }
                    }
                } catch (e) {
                    log('⚠️ API error, using direct URL', 'warning');
                }

                // Use direct URL as fallback
                const directUrl = getDirectFanTanUrl();
                log('✅ Using direct Fan Tan URL', 'success');
                return {
                    success: true,
                    game_name: 'Fan Tan',
                    game_url: directUrl,
                    raw: { gameName: 'Fan Tan', gameUrl: directUrl }
                };
            }

            // ─── UI UPDATE ──────────────────────────────────
            function updateGameUI(gameInfo) {
                if (!gameInfo || !gameInfo.success) {
                    gameName.textContent = 'Not Found';
                    gameStatus.textContent = '❌ Error';
                    gameStatus.style.color = '#ff6b6b';
                    log('❌ Game not found', 'error');
                    return;
                }

                state.gameUrl = gameInfo.game_url;
                state.gameName = gameInfo.game_name || 'Fan Tan';

                gameName.textContent = state.gameName;
                gameId.textContent = '27873';
                gameStatus.textContent = '✅ Ready to Launch';
                gameStatus.style.color = '#7dffb3';

                log(`✅ ${state.gameName} loaded!`, 'success');
                log('🚀 Click "LAUNCH" to start the game', 'info');
            }

            // ─── HANDLERS ────────────────────────────────────
            async function handleLogin() {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '⏳ Logging in...';
                clearLog();
                log('🚀 Starting...', 'info');

                const success = await login(state.phone, state.password);

                if (success) {
                    loginSection.classList.add('hidden');
                    gameSection.classList.remove('hidden');
                    
                    // Load game
                    const gameInfo = await getGameUrl(27873);
                    if (gameInfo && gameInfo.success) {
                        updateGameUI(gameInfo);
                    }
                    
                    log('✅ Ready to launch Fan Tan!', 'success');
                } else {
                    log('❌ Login failed. Please try again.', 'error');
                }

                loginBtn.disabled = false;
                loginBtn.innerHTML = '🔑 Login & Load Game';
            }

            function handleLaunch() {
                if (!state.gameUrl) {
                    log('❌ No game URL available. Please refresh.', 'error');
                    return;
                }

                log('🚀 Launching Fan Tan game...', 'info');
                
                // Try to open in new window
                try {
                    const win = window.open(state.gameUrl, '_blank');
                    if (win) {
                        log('✅ Game opened in new tab!', 'success');
                    } else {
                        // If popup blocked, use current window
                        window.location.href = state.gameUrl;
                        log('✅ Redirecting to game...', 'success');
                    }
                } catch (e) {
                    // Fallback - direct navigation
                    window.location.href = state.gameUrl;
                    log('✅ Opening game...', 'success');
                }
            }

            function handleShowUrl() {
                if (!state.gameUrl) {
                    log('❌ No game URL available', 'error');
                    return;
                }

                urlCard.style.display = 'block';
                urlDisplay.textContent = state.gameUrl;
                log('🔗 Game URL displayed', 'info');
            }

            function handleCopyUrl() {
                if (!state.gameUrl) {
                    log('❌ No URL to copy', 'error');
                    return;
                }

                if (navigator.clipboard) {
                    navigator.clipboard.writeText(state.gameUrl).then(() => {
                        log('📋 URL copied to clipboard!', 'success');
                    }).catch(() => {
                        // Fallback
                        const textArea = document.createElement('textarea');
                        textArea.value = state.gameUrl;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        log('📋 URL copied!', 'success');
                    });
                } else {
                    // Fallback
                    const textArea = document.createElement('textarea');
                    textArea.value = state.gameUrl;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    log('📋 URL copied!', 'success');
                }
            }

            async function handleRefresh() {
                log('🔄 Refreshing game...', 'info');
                const gameInfo = await getGameUrl(27873);
                if (gameInfo && gameInfo.success) {
                    updateGameUI(gameInfo);
                    urlCard.style.display = 'none';
                    log('✅ Game refreshed!', 'success');
                }
            }

            // ─── EVENT LISTENERS ────────────────────────────
            loginBtn.addEventListener('click', handleLogin);
            launchBtn.addEventListener('click', handleLaunch);
            showUrlBtn.addEventListener('click', handleShowUrl);
            refreshBtn.addEventListener('click', handleRefresh);
            copyUrlBtn.addEventListener('click', handleCopyUrl);

            // Enter key for login
            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !loginSection.classList.contains('hidden')) {
                    handleLogin();
                }
            });

            // ─── AUTO LOGIN ────────────────────────────────────
            window.addEventListener('DOMContentLoaded', function() {
                log('🎯 Fan Tan Game Launcher Ready', 'info');
                log('📱 Phone: 8597630383', 'info');
                log('🔐 Password: Sanju2005', 'info');
                log('⏳ Auto-login in 1 second...', 'info');
                
                setTimeout(() => {
                    handleLogin();
                }, 1000);
            });

        })();
    </script>
</body>
</html>
